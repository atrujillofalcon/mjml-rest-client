plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '2.4.21'
    id 'org.jetbrains.dokka' version '2.2.0'
    id 'jacoco'
    id 'com.vanniktech.maven.publish' version '0.37.0'
}

group = 'es.atrujillo.mjml'
version = project.property('version')
repositories { mavenCentral() }
kotlin { jvmToolchain(21) }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

dependencies {
    api 'com.squareup.okhttp3:okhttp-jvm:5.5.1'
    implementation platform('com.fasterxml.jackson:jackson-bom:2.23.0')
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.module:jackson-module-kotlin'
    api 'org.thymeleaf:thymeleaf:3.1.5.RELEASE'
    api 'org.slf4j:slf4j-api:2.0.20'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.20'
}

test { useJUnitPlatform { excludeTags 'live' } }
tasks.register('liveTest', Test) {
    description = 'Calls the real MJML API using MJML_APP_ID and MJML_SECRET_KEY.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'live' }
    doFirst {
        ['MJML_APP_ID', 'MJML_SECRET_KEY'].each {
            if (!System.getenv(it)) throw new GradleException("Missing environment variable: $it")
        }
    }
}
jacoco { toolVersion = '0.8.16' }
jacocoTestReport {
    dependsOn test
    reports { xml.required = true; html.required = true }
}
mavenPublishing {
    coordinates(project.group.toString(), 'mjml-rest-client', project.version.toString())
    publishToMavenCentral(true, com.vanniktech.maven.publish.DeploymentValidation.PUBLISHED)
    if (providers.gradleProperty('signingInMemoryKey').isPresent()) signAllPublications()
    pom {
        name = 'Mjml Rest Client'
        description = 'Framework-independent JVM client for the MJML rendering API, with Thymeleaf templates.'
        url = 'https://github.com/atrujillofalcon/mjml-rest-client'
        licenses { license { name = 'Apache License, Version 2.0'; url = 'https://www.apache.org/licenses/LICENSE-2.0.txt' } }
        developers { developer { id = 'atrujillo'; name = 'Arnaldo Trujillo'; email = 'atrujillo92work@gmail.com' } }
        scm {
            url = 'https://github.com/atrujillofalcon/mjml-rest-client'
            connection = 'scm:git:https://github.com/atrujillofalcon/mjml-rest-client.git'
            developerConnection = 'scm:git:ssh://git@github.com/atrujillofalcon/mjml-rest-client.git'
        }
    }
}
publishing { repositories { maven { name = 'verification'; url = layout.buildDirectory.dir('verification-repository') } } }

// Keep framework coupling out of the published runtime dependency graph.
tasks.register('verifyRuntimeDependencies') {
    group = 'verification'
    doLast {
        def forbidden = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll {
            it.moduleVersion.id.group.startsWith('org.springframework') ||
                it.moduleVersion.id.group.startsWith('org.apache.httpcomponents')
        }
        if (!forbidden.isEmpty()) throw new GradleException("Unexpected HTTP framework dependencies: $forbidden")
    }
}
tasks.named('check') { dependsOn 'verifyRuntimeDependencies' }
